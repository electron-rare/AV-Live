<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AV-Live — Control</title><link rel="stylesheet" href="control.css"></head>
<body>
<header><h1>AV-Live Control</h1><span id="status" class="off"></span></header>
<section><h2>Patterns</h2>
  <div class="grid">
    <div class="pat-cell"><button data-pad="kick">Kick</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="kick"></div>
    <div class="pat-cell"><button data-pad="hats">Hats</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="hats"></div>
    <div class="pat-cell"><button data-pad="clap">Clap</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="clap"></div>
    <div class="pat-cell"><button data-pad="perc">Perc</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="perc"></div>
    <div class="pat-cell"><button data-pad="sub">Sub</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="sub"></div>
    <div class="pat-cell"><button data-pad="acid">Acid</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="acid"></div>
    <div class="pat-cell"><button data-pad="arp">Arp</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="arp"></div>
    <div class="pat-cell"><button data-pad="lead">Lead</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="lead"></div>
    <div class="pat-cell"><button data-pad="stab">Stab</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="stab"></div>
    <div class="pat-cell"><button data-pad="pad">Pad</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="pad"></div>
    <div class="pat-cell"><button data-pad="ride">Ride</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="ride"></div>
    <div class="pat-cell"><button data-pad="rim">Rim</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="rim"></div>
    <div class="pat-cell"><button data-pad="tom">Tom</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="tom"></div>
    <div class="pat-cell"><button data-pad="reese">Reese</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="reese"></div>
    <div class="pat-cell"><button data-pad="bells">Bells</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="bells"></div>
    <div class="pat-cell"><button data-pad="sweep">Sweep</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="sweep"></div>
  </div>
  <button id="clear" class="wide">Tout couper</button>
  <label>Tempo <input id="tempo" type="range" min="60" max="180" value="126"></label>
</section>
<section><h2>Concert</h2>
  <div class="grid">
    <button data-osc="/control/concertNext" data-arg="1">Morceau suivant</button>
    <button data-osc="/control/doScene" data-arg="concert">Scène concert</button>
    <button data-osc="/control/doScene" data-arg="play">Body-play</button>
  </div>
</section>
<section><h2>Harmonie</h2>
  <div class="grid">
    <button data-osc="/control/harmony/root" data-arg="-2">Root −</button>
    <button data-osc="/control/harmony/root" data-arg="2">Root +</button>
    <button data-osc="/control/harmony/scale" data-arg="minor">Minor</button>
    <button data-osc="/control/harmony/scale" data-arg="dorian">Dorian</button>
    <button data-osc="/control/harmony/scale" data-arg="phrygian">Phrygian</button>
    <button data-osc="/control/harmony/scale" data-arg="penta">Penta</button>
    <button data-osc="/control/harmony/octave" data-arg="0">Oct 0</button>
    <button data-osc="/control/harmony/octave" data-arg="1">Oct +1</button>
    <button data-osc="/control/harmony/phrase" data-arg="0">Phr 0</button>
    <button data-osc="/control/harmony/phrase" data-arg="1">Phr 1</button>
    <button data-osc="/control/harmony/phrase" data-arg="2">Phr 2</button>
    <button data-osc="/control/harmony/phrase" data-arg="3">Phr 3</button>
  </div>
</section>
<section><h2>FX</h2>
  <label>Filtre <input id="filter" type="range" min="0" max="1" step="0.01" value="1"></label>
  <div class="grid">
    <button data-osc="/control/fx/stutter">Stutter</button>
    <button data-osc="/control/fx/crash">Crash</button>
    <button data-osc="/control/fx/kick">Kick</button>
    <button data-osc="/control/fx/swell">Swell</button>
    <button data-osc="/control/fx/breakdown" data-arg="1">Breakdown ↓</button>
    <button data-osc="/control/fx/breakdown" data-arg="0">Breakdown ↑</button>
  </div>
</section>
<script src="control.js"></script></body></html>
