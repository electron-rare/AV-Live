<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AV-Live — Control</title><link rel="stylesheet" href="control.css"></head>
<body>
<header>
  <h1>AV-Live Control</h1>
  <span id="status" class="off"></span>
  <span id="beat-dot" class="beat-dot"></span>
  <div class="vu-wrap"><div id="vu-bar" class="vu-bar"></div></div>
</header>
<nav class="tab-bar">
  <button class="tab-btn active" data-tab="live">LIVE</button>
  <button class="tab-btn" data-tab="fx">FX / HARMONIE / CONCERT</button>
  <button class="tab-btn" data-tab="seq">SÉQUENCEURS</button>
  <button class="tab-btn" data-tab="sections">SECTIONS</button>
  <button class="tab-btn" data-tab="matrix">MATRICE</button>
</nav>

<div class="tab-panel active" id="tab-live">
<section><h2>Patterns</h2>
  <div class="grid">
    <div class="pat-cell"><button data-pad="kick">Kick</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="kick"></div>
    <div class="pat-cell"><button data-pad="hats">Hats</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="hats"></div>
    <div class="pat-cell"><button data-pad="clap">Clap</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="clap"></div>
    <div class="pat-cell"><button data-pad="perc">Perc</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="perc"></div>
    <div class="pat-cell"><button data-pad="sub">Sub</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="sub"></div>
    <div class="pat-cell"><button data-pad="acid">Acid</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="acid"></div>
    <div class="pat-cell"><button data-pad="arp">Arp</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="arp"></div>
    <div class="pat-cell"><button data-pad="lead">Lead</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="lead"></div>
    <div class="pat-cell"><button data-pad="stab">Stab</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="stab"></div>
    <div class="pat-cell"><button data-pad="pad">Pad</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="pad"></div>
    <div class="pat-cell"><button data-pad="ride">Ride</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="ride"></div>
    <div class="pat-cell"><button data-pad="rim">Rim</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="rim"></div>
    <div class="pat-cell"><button data-pad="tom">Tom</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="tom"></div>
    <div class="pat-cell"><button data-pad="reese">Reese</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="reese"></div>
    <div class="pat-cell"><button data-pad="bells">Bells</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="bells"></div>
    <div class="pat-cell"><button data-pad="sweep">Sweep</button><input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="sweep"></div>
  </div>
  <button id="clear" class="wide">Tout couper</button>
  <label>Tempo <button id="tempo-minus" class="tempo-step" type="button">-</button><input id="tempo" type="range" min="60" max="180" value="126"><button id="tempo-plus" class="tempo-step" type="button">+</button><span id="tempo-val">126</span></label>
  <label>Master <button id="master-minus" class="tempo-step" type="button">-</button><input id="master" type="range" min="0" max="2" step="0.05" value="1"><button id="master-plus" class="tempo-step" type="button">+</button><span id="master-val">1.00</span></label>
  <div class="quant-bar">
    <span class="quant-label">Quant</span>
    <button class="quant-btn" data-quant="0.5">½</button>
    <button class="quant-btn" data-quant="1">1</button>
    <button class="quant-btn active" data-quant="4">1 mes</button>
    <button class="quant-btn" data-quant="8">2 mes</button>
  </div>
</section>
</div>

<div class="tab-panel" id="tab-fx">
<section><h2>FX</h2>
  <label>Filtre <input id="filter" type="range" min="0" max="1" step="0.01" value="1"></label>
  <div class="grid">
    <button data-osc="/control/fx/stutter">Stutter</button>
    <button data-osc="/control/fx/crash">Crash</button>
    <button data-osc="/control/fx/kick">Kick</button>
    <button data-osc="/control/fx/swell">Swell</button>
    <button data-osc="/control/fx/breakdown" data-arg="1">Breakdown ↓</button>
    <button data-osc="/control/fx/breakdown" data-arg="0">Breakdown ↑</button>
  </div>
</section>
<section><h2>Harmonie</h2>
  <div class="grid">
    <button data-osc="/control/harmony/root" data-arg="-2">Root −</button>
    <button data-osc="/control/harmony/root" data-arg="2">Root +</button>
    <button data-osc="/control/harmony/scale" data-arg="minor">Minor</button>
    <button data-osc="/control/harmony/scale" data-arg="dorian">Dorian</button>
    <button data-osc="/control/harmony/scale" data-arg="phrygian">Phrygian</button>
    <button data-osc="/control/harmony/scale" data-arg="penta">Penta</button>
    <button data-osc="/control/harmony/octave" data-arg="0">Oct 0</button>
    <button data-osc="/control/harmony/octave" data-arg="1">Oct +1</button>
    <button data-osc="/control/harmony/phrase" data-arg="0">Phr 0</button>
    <button data-osc="/control/harmony/phrase" data-arg="1">Phr 1</button>
    <button data-osc="/control/harmony/phrase" data-arg="2">Phr 2</button>
    <button data-osc="/control/harmony/phrase" data-arg="3">Phr 3</button>
  </div>
</section>
<section><h2>Concert</h2>
  <div class="grid">
    <button data-osc="/control/concertNext" data-arg="1">Morceau suivant</button>
    <button data-osc="/control/doScene" data-arg="concert">Scène concert</button>
    <button data-osc="/control/doScene" data-arg="play">Body-play</button>
  </div>
</section>
</div>

<div class="tab-panel" id="tab-seq">
<section><h2>Séquenceurs</h2>
  <div class="seq-block">
    <h3>Mélodie</h3>
    <div class="seq-row">
      <button data-pad="melseq">Arm Mél</button>
      <button data-seq="melody" data-seqidx="0" class="sel">M1</button>
      <button data-seq="melody" data-seqidx="1">M2</button>
      <button data-seq="melody" data-seqidx="2">M3</button>
      <button data-seq="melody" data-seqidx="3">M4</button>
      <button data-seq="melody" data-seqidx="4">M5</button>
      <button data-seq="melody" data-seqidx="5">M6</button>
      <button data-seq="melody" data-seqidx="6">M7</button>
      <button data-seq="melody" data-seqidx="7">M8</button>
    </div>
    <div class="name-row">
      <input type="text" class="preset-name" id="mel-name" placeholder="Nom du preset">
    </div>
    <div id="mel-steps" class="mel-steps"></div>
    <input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="melseq">
  </div>
  <div class="seq-block">
    <h3>Rythme</h3>
    <div class="seq-row">
      <button data-pad="rhythmseq">Arm Rhy</button>
      <button data-seq="rhythm" data-seqidx="0" class="sel">R1</button>
      <button data-seq="rhythm" data-seqidx="1">R2</button>
      <button data-seq="rhythm" data-seqidx="2">R3</button>
      <button data-seq="rhythm" data-seqidx="3">R4</button>
      <button data-seq="rhythm" data-seqidx="4">R5</button>
      <button data-seq="rhythm" data-seqidx="5">R6</button>
      <button data-seq="rhythm" data-seqidx="6">R7</button>
      <button data-seq="rhythm" data-seqidx="7">R8</button>
    </div>
    <div class="name-row">
      <input type="text" class="preset-name" id="rhy-name" placeholder="Nom du preset">
    </div>
    <div id="rhy-grid" class="step-grid"></div>
    <input type="range" min="0" max="1.5" step="0.05" value="0.8" data-vol="rhythmseq">
  </div>
</section>
</div>
<div class="tab-panel" id="tab-sections">
<section><h2>Sections</h2>
  <div class="mode-bar">
    <span class="mode-label">Mode</span>
    <button class="mode-btn active" data-mode="launch">LANCER</button>
    <button class="mode-btn" data-mode="save">ENREGISTRER</button>
    <button class="mode-btn" data-mode="clear">EFFACER</button>
  </div>
  <div class="scene-grid">
    <button class="scene-slot" data-scene="0">1</button>
    <button class="scene-slot" data-scene="1">2</button>
    <button class="scene-slot" data-scene="2">3</button>
    <button class="scene-slot" data-scene="3">4</button>
    <button class="scene-slot" data-scene="4">5</button>
    <button class="scene-slot" data-scene="5">6</button>
    <button class="scene-slot" data-scene="6">7</button>
    <button class="scene-slot" data-scene="7">8</button>
  </div>
  <div class="scene-nav">
    <button id="scene-prev">&#9664; PREV</button>
    <button id="scene-next">NEXT &#9654;</button>
  </div>
</section>
</div>
<div class="tab-panel" id="tab-matrix">
<section><h2>Matrice</h2>
  <div class="matrix-transport">
    <button id="matrix-play">PLAY</button>
    <button id="matrix-stop">STOP</button>
    <button id="matrix-clear">CLEAR</button>
    <button id="matrix-evolve" class="mat-evolve">ÉVOLUE</button>
    <input id="matrix-evolve-rate" type="range" min="0" max="1" step="0.01" value="0.15" title="taux d'évolution">
    <button id="kit-default" class="kit-btn" data-kit="default">DEFAULT</button>
    <button id="kit-deep" class="kit-btn" data-kit="deep">DEEP</button>
    <button id="kit-industrial" class="kit-btn" data-kit="industrial">INDUS</button>
    <button id="kit-acid" class="kit-btn" data-kit="acid">ACID</button>
  </div>
  <div class="matrix-persist">
    <input type="text" id="matrix-name" class="matrix-name-input" placeholder="nom de la matrice">
    <button id="matrix-save" class="mat-action-btn">SAUVER</button>
    <select id="matrix-list" class="matrix-list-select"></select>
    <button id="matrix-load" class="mat-action-btn">CHARGER</button>
    <button id="matrix-loadnext" class="mat-action-btn" title="Charge a la fin de la boucle">SUIVANT</button>
    <button id="matrix-refresh" class="mat-refresh-btn" title="Rafraichir la liste">&#8635;</button>
  </div>
  <button id="matrix-loop-full" class="mat-action-btn mat-loop-full-btn">BOUCLE COMPLETE</button>
  <div class="matrix-scroll">
    <div id="matrix-timeline" class="matrix-timeline"></div>
    <div id="matrix-grid"></div>
  </div>
  <div id="matrix-mixer" class="matrix-mixer"></div>
  <div id="morceau-panel" class="morceau-panel">
    <div class="morceau-global">
      <label class="morceau-bpm">Tempo <input id="matrix-bpm" type="range" min="20" max="300" step="1" value="120"><output id="matrix-bpm-out">120</output></label>
    </div>
    <div class="morceau-title">Actions globales (morceau)</div>
    <div id="morceau-slots" class="morceau-slots"></div>
    <div class="morceau-title">Réglages</div>
    <div id="morceau-settings" class="morceau-settings"></div>
  </div>
</section>
</div>
<script type="module">import * as G from "./matrix_glow.js"; window.MatrixGlow = G;</script>
<script type="module" src="js/main.js"></script></body></html>
