<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sound_algo / hydra</title>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #e8e8e8;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            overflow: hidden;
        }
        #hydra-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }
        #ui {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 1rem;
            pointer-events: none;
        }
        #ui > * { pointer-events: auto; }
        .badge {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            font-size: 0.75rem;
            color: #b0b0b0;
        }
        .badge .v { color: #5b5bff; font-variant-numeric: tabular-nums; }
        #editor-toggle {
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
        }
        #editor-toggle:hover { border-color: #5b5bff; }
        #editor {
            position: fixed;
            top: 60px;
            right: 1rem;
            width: 480px;
            max-width: calc(100vw - 2rem);
            max-height: 70vh;
            background: rgba(15,15,20,0.92);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            display: none;
            flex-direction: column;
            z-index: 20;
        }
        #editor.open { display: flex; }
        #editor textarea {
            background: transparent;
            color: #e8e8e8;
            border: none;
            outline: none;
            padding: 0.75rem;
            font: inherit;
            font-size: 0.8rem;
            resize: none;
            flex: 1;
            min-height: 200px;
        }
        #editor .tools {
            display: flex;
            gap: 0.4rem;
            padding: 0.5rem 0.75rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            flex-wrap: wrap;
        }
        #editor button {
            background: #1b1b27;
            border: 1px solid #2c2c36;
            color: #e8e8e8;
            padding: 0.35rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            font-family: inherit;
        }
        #editor button:hover { border-color: #5b5bff; }
        #status {
            font-size: 0.7rem;
            color: #6b6b75;
            padding: 0 0.75rem 0.5rem;
        }
    </style>
</head>
<body>
    <canvas id="hydra-canvas"></canvas>

    <div id="ui">
        <div class="badge">
            BPM <span class="v" id="bpm">--</span> ·
            beat <span class="v" id="beat">0</span> ·
            <span id="ws-state">offline</span>
        </div>
        <button id="editor-toggle">code [E]</button>
    </div>

    <div id="editor">
        <textarea id="code" spellcheck="false"></textarea>
        <div class="tools">
            <button data-preset="default">default</button>
            <button data-preset="osc">oscWobble</button>
            <button data-preset="kaleido">kaleido</button>
            <button data-preset="grid">grid</button>
            <button data-preset="warp">warp</button>
            <button data-preset="pixel">pixel</button>
            <button id="run">run [Ctrl+Enter]</button>
        </div>
        <div id="status"></div>
    </div>

    <!-- Hydra synthesizer (CDN) -->
    <script src="https://unpkg.com/hydra-synth@1.3.29/dist/hydra-synth.js"></script>
    <script src="app.js"></script>
</body>
</html>
